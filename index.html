<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="scripts/config.js" defer></script>
    <script src="scripts/script.js" defer></script>
    <script src="scripts/main.js" defer></script>
</head>
<body>
    <header>
        <h1 class="archivo-black-regular">
            To-Do List
        </h1>
        <h2 class="archivo-black-regular">
            Utilisez cette application pour gérer vos taches!
        </h2>
    </header>
    <main class="montserrat">
        <div class="todo-container">
            <div class="input-section">
                <input type="checkbox" id="select-all" name="select-all" class="select-all"> Tout sélectionner
                <input type="text" id="todo-input" placeholder="Ajouter une nouvelle tache...">
                <button id="add-button">Ajouter</button>
                
            </div>

            <div class="delButton">
                <button id="clear-button" class="delete">Supprimer</button>
            </div>
            <ul id="todo-list">
                
            </ul>
        </div>
    </main>
    <footer>
        <p>
            &copy; 2025 ThornedN. merci de ne pas voler,<br>tous les voleurs sont des giga paffloteurs
        </p>

    </footer>
</body>
</html>
